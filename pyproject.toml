[project]
name = "hearing-to-seeing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "4rldur0", email = "ngim24863@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "numpy>=2.5.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
hearing-to-seeing = "hearing_to_seeing.cli:main"
hearing-to-seeing-web = "web.app:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["hearing_to_seeing", "web"]
