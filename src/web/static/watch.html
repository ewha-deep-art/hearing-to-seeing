<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearing to Seeing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/"><span class="logo-mark">H→S</span>Hearing to Seeing</a>
  </header>

  <main class="watch">
    <section>
      <div class="player" id="player" tabindex="-1">
        <div class="stage" id="stage">
          <div id="yt"></div>
          <div class="subs-clip"><canvas class="subs" id="subs"></canvas></div>
          <!-- Takes the clicks the YouTube frame would otherwise swallow. -->
          <div class="click-layer" id="click-layer"></div>
        </div>
        <div class="player-state" id="state"><div class="spinner"></div></div>
        <button class="big-play" id="big-play" type="button" aria-label="재생" hidden></button>
        <div class="toast" id="toast"></div>
        <div class="controls" id="controls" hidden>
          <div class="seek" id="seek">
            <div class="seek-track">
              <div class="seek-buffered" id="seek-buffered"></div>
              <div class="seek-played" id="seek-played"></div>
              <div class="seek-thumb" id="seek-thumb"></div>
            </div>
            <div class="seek-tip" id="seek-tip" hidden></div>
          </div>
          <div class="control-row">
            <button class="icon-btn" id="play" type="button" aria-label="재생 (k)"></button>
            <div class="volume">
              <button class="icon-btn" id="mute" type="button" aria-label="음소거 (m)"></button>
              <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="볼륨">
            </div>
            <span class="time" id="time">0:00 / 0:00</span>
            <span class="spacer"></span>
            <div class="fx-chips" id="fx-chips" role="group" aria-label="자막 효과">
              <button class="fx-chip" type="button" data-effect="color" title="누가 말하는지 색으로 구분해요">인물 색</button>
              <button class="fx-chip" type="button" data-effect="names" title="말하는 사람이 바뀌면 줄 앞에 이름을 보여 줘요">인물 이름</button>
              <button class="fx-chip" type="button" data-effect="fill" title="말하는 순간 글자가 채워져요">말 타이밍</button>
              <button class="fx-chip" type="button" data-effect="volume" title="큰 소리는 커지고 작은 소리는 작아져요">소리 크기</button>
              <button class="fx-chip" type="button" data-effect="wave" title="말소리가 물결처럼 움직여요">물결 효과</button>
            </div>
            <button class="icon-btn sub-toggle" id="sub-toggle" type="button" aria-label="자막 (c)"></button>
            <details class="menu sub-settings" id="sub-settings">
              <summary class="icon-btn" id="sub-settings-button" aria-label="자막 설정"></summary>
              <div class="menu-list settings-panel">
                <!-- On narrow screens the effect chips move in here (watch.js). -->
                <div class="fx-chips-slot" id="fx-chips-slot"></div>
                <div class="setting-row">
                  <span>글자 크기</span>
                  <div class="sub-mode" role="group" aria-label="자막 크기">
                    <button type="button" id="sub-smaller" aria-label="자막 작게 (-)">가−</button>
                    <span class="scale-label" id="sub-scale-label">100%</span>
                    <button type="button" id="sub-larger" aria-label="자막 크게 (+)">가+</button>
                  </div>
                </div>
                <button class="setting-reset" id="sub-reset" type="button">기본값으로</button>
              </div>
            </details>
            <button class="icon-btn" id="fullscreen" type="button" aria-label="전체 화면 (f)"></button>
          </div>
        </div>
      </div>

      <div class="watch-meta">
        <h1 id="title"></h1>
        <div class="meta-row">
          <div class="legend" id="legend"></div>
          <details class="menu" id="downloads" hidden>
            <summary class="btn" id="downloads-button">자막 내려받기</summary>
            <div class="menu-list">
              <a data-kind="ass">키네틱 자막 (.ass)<small>지금 자막 설정 그대로</small></a>
              <a data-kind="plain">일반 자막 (.ass)<small>효과 없음</small></a>
            </div>
          </details>
        </div>
        <div class="meta-sub" id="meta-sub"></div>
        <a class="source-link" id="source-link" target="_blank" rel="noopener" hidden>YouTube에서 보기 ↗</a>
      </div>
    </section>

    <aside class="script" id="script" hidden>
      <div class="script-head">
        <h2>스크립트</h2>
        <label><input type="checkbox" id="autoscroll" checked> 자동 스크롤</label>
      </div>
      <ol class="script-list" id="script-list"></ol>
    </aside>
  </main>

  <script type="module" src="/static/watch.js"></script>
</body>
</html>
